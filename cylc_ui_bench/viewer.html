<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cylc-ui-bench results</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2em; color: #222; }
  h2 { margin-top: 2em; border-bottom: 1px solid #ccc; }
  .details { color: #666; font-size: 0.9em; }
  table { border-collapse: collapse; margin: 1em 0; font-size: 0.9em; }
  th, td { padding: 0.3em 0.8em; border-bottom: 1px solid #eee; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  small { color: #888; }
  .faster { color: #2a7d2a; font-weight: bold; }
  .slower { color: #b22; font-weight: bold; }
  .grid { display: flex; flex-wrap: wrap; gap: 1em; }
  .legend > span { margin-right: 1.5em; }
  .swatch { display: inline-block; width: 0.8em; height: 0.8em; margin-right: 0.3em; border-radius: 50%; }
  #controls { border: 2px dashed #aaa; padding: 1em; color: #666; }
  #controls.over { border-color: #1f77b4; color: #1f77b4; }
</style>
</head>
<body>
<h1>cylc-ui-bench results</h1>
<div id="controls">
  Open or drop <code>.jsonl</code> results files: <input type="file" id="files" multiple accept=".jsonl">
  &nbsp; Statistic per run:
  <select id="stat"><option value="p50">median (p50)</option><option value="mean">mean</option></select>
</div>
<div id="out"></div>
<script id="data" type="application/x-ndjson"></script>
<script>
// no red/green, which are used for slower/faster
const COLOURS = ['#1f77b4', '#ff7f0e', '#9467bd', '#8c564b', '#17becf']
const out = document.getElementById('out')
const statSelect = document.getElementById('stat')
let runs = []

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)
const fmt = (ms) => ms === 0 ? '0' : ms >= 100 ? ms.toFixed(0) : ms >= 10 ? ms.toFixed(1) : ms.toFixed(2)
const fmtDate = (d) => d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
const parse = (text) => text.split('\n').filter((l) => l.trim()).map((l) => JSON.parse(l))

// [threshold, suffix] per unit: values are shown in the first unit they reach
const UNITS = { bytes: [[2 ** 30, 'GiB'], [2 ** 20, 'MiB'], [2 ** 10, 'KiB'], [1, 'B']] }
function unitScale (unit, value) {
  for (const [divisor, suffix] of UNITS[unit] ?? []) {
    if (Math.abs(value) >= divisor) return [divisor, suffix]
  }
  return [1, UNITS[unit]?.at(-1)[1] ?? unit]
}
const fmtV = (value, unit, [divisor, suffix] = unitScale(unit, value)) => `${fmt(value / divisor)} ${suffix}`

const groupKey = ({ meta }) => JSON.stringify([meta.suite ?? 'store', meta.counts ?? meta.scale ?? meta.scaleName ?? null])

function median (xs) {
  const s = [...xs].sort((a, b) => a - b)
  const m = s.length >> 1
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2
}

function niceMax (v) {
  const p = 10 ** Math.floor(Math.log10(v))
  return [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map((f) => f * p).find((n) => n >= v)
}

function render () {
  out.innerHTML = ''
  // one section per suite and workload size
  const groups = new Map()
  for (const run of runs) {
    const key = groupKey(run)
    if (!groups.has(key)) groups.set(key, [])
    groups.get(key).push(run)
  }
  const order = ({ meta: a }, { meta: b }) =>
    (a.suite ?? 'store').localeCompare(b.suite ?? 'store') ||
    (a.counts?.tasks ?? 0) - (b.counts?.tasks ?? 0) ||
    (a.counts?.cycles ?? 0) - (b.counts?.cycles ?? 0)
  for (const group of [...groups.values()].sort((a, b) => order(a[0], b[0]))) {
    out.append(renderGroup(group, statSelect.value))
  }
}

function renderGroup (group, stat) {
  const labels = [...new Set(group.map((r) => r.meta.label))]
  const scenarios = [...new Set(group.flatMap((r) => r.results.map((x) => x.name)))]
  const colour = (label) => COLOURS[labels.indexOf(label) % COLOURS.length]

  // points[scenario][label] = one point per run; states[scenario][label] = other states seen
  const points = {}
  const states = {}
  const units = {}
  for (const run of group) {
    for (const x of run.results) {
      units[x.name] ??= x.unit ?? 'ms'
      if (x.state !== 'completed') {
        ((states[x.name] ??= {})[run.meta.label] ??= new Set()).add(x.state)
        continue
      }
      ((points[x.name] ??= {})[run.meta.label] ??= []).push({
        date: new Date(run.meta.date), value: x[stat], min: x.min, max: x.max,
      })
    }
  }
  const medians = {}
  for (const s of scenarios) {
    medians[s] = {}
    for (const l of labels) {
      if (points[s]?.[l]) medians[s][l] = median(points[s][l].map((p) => p.value))
    }
  }

  const dates = group.map((r) => new Date(r.meta.date))
  const t0 = Math.min(...dates)
  const t1 = Math.max(...dates)
  const { suite = 'store', counts, scaleName, vue, vueBuild, node, iterations, gc } = group[0].meta
  const ctx = { labels, scenarios, points, states, units, medians, colour, stat, t0, t1 }

  let heading = esc(suite)
  if (counts) {
    heading += `: ${counts.tasks} tasks, ${counts.jobs} jobs, ${counts.families} families, ${counts.cycles} cycles`
  } else if (scaleName && scaleName !== 'default') {
    heading += `: scale ${esc(scaleName)}`
  }
  const details = [
    vue && `vue ${esc(vue)} (${esc(vueBuild)})`,
    `node ${esc(node)}`,
    gc !== undefined && `forced gc: ${esc(gc)}`,
    iterations && `${iterations} iterations/run`,
  ].filter(Boolean).join(', ')

  const section = document.createElement('section')
  section.innerHTML = `
    <h2>${heading}</h2>
    <p class="details">${group.length} runs, ${fmtDate(new Date(t0))} to ${fmtDate(new Date(t1))};
      ${details}. Values are the median over runs of each run's ${stat}; lower is better.</p>
    <p class="legend">${labels.map((l) => `<span><span class="swatch" style="background:${colour(l)}"></span>${esc(l)}</span>`).join('')}</p>
    ${table(ctx)}
    ${speedupChart(ctx)}
    <h3>Per-run ${stat} over time</h3>
    <p class="details">Dots are each run's ${stat}, vertical lines its min-max over iterations, dashed lines the median over runs. Hover a dot for details.</p>
    <div class="grid">${scenarios.map((s) => scenarioChart(s, ctx)).join('')}</div>`
  return section
}

function table ({ labels, scenarios, points, states, units, medians }) {
  const head = `<tr><th>scenario</th>${labels.map((l) => `<th>${esc(l)}</th>`).join('')}</tr>`
  const rows = scenarios.map((s) => {
    const base = medians[s][labels[0]]
    const scale = unitScale(units[s], base ?? Object.values(medians[s])[0] ?? 0)
    const cells = labels.map((l, i) => {
      const m = medians[s][l]
      if (m === undefined) {
        const other = states[s]?.[l]
        return `<td>${other ? `<small>${esc([...other].join(', '))}</small>` : '-'}</td>`
      }
      const vals = points[s][l].map((p) => p.value)
      const v = (x) => fmt(x / scale[0])
      let text = `${fmtV(m, units[s], scale)} <small>[${v(Math.min(...vals))}-${v(Math.max(...vals))}] n=${vals.length}</small>`
      if (i > 0 && base) {
        const x = base / m
        text += ` <span class="${x >= 1 ? 'faster' : 'slower'}">${x.toFixed(2)}x</span>`
      }
      return `<td>${text}</td>`
    })
    return `<tr><td>${esc(s)}</td>${cells.join('')}</tr>`
  })
  return `<table>${head}${rows.join('')}</table>`
}

function speedupChart ({ labels, scenarios, medians, colour }) {
  const others = labels.slice(1)
  const groups = scenarios
    .map((s) => ({
      s,
      bars: others
        .map((l) => ({ l, x: medians[s][labels[0]] / medians[s][l] }))
        .filter((b) => Number.isFinite(b.x)),
    }))
    .filter((g) => g.bars.length)
  if (!groups.length) return ''
  const barH = 20
  const gap = 10
  const left = 130
  const width = 640
  const maxX = Math.max(2, ...groups.flatMap((g) => g.bars.map((b) => b.x))) * 1.1
  const xPos = (v) => left + (v / maxX) * (width - left - 50)
  let y = 6
  let svg = ''
  for (const { s, bars } of groups) {
    svg += `<text x="${left - 8}" y="${y + (bars.length * barH) / 2 + 4}" text-anchor="end">${esc(s)}</text>`
    for (const b of bars) {
      // with one comparison colour by result, otherwise by branch (see legend)
      const fill = others.length > 1 ? colour(b.l) : b.x >= 1 ? '#2a7d2a' : '#b22'
      svg += `<rect x="${left}" y="${y + 2}" width="${xPos(b.x) - left}" height="${barH - 4}" fill="${fill}" opacity="0.85"><title>${esc(b.l)}</title></rect>`
      svg += `<text x="${xPos(b.x) + 5}" y="${y + barH - 6}">${b.x.toFixed(2)}x</text>`
      y += barH
    }
    y += gap
  }
  const height = y + 24
  svg += `<line x1="${xPos(1)}" x2="${xPos(1)}" y1="4" y2="${y}" stroke="#333" stroke-dasharray="4 3"/>`
  svg += `<text x="${xPos(1)}" y="${height - 8}" text-anchor="middle" fill="#666">1x = ${esc(labels[0])}</text>`
  return `<h3>Relative to ${esc(labels[0])} (baseline / value: higher is better, i.e. faster or smaller)</h3>
    <svg width="${width}" height="${height}" font-size="12">${svg}</svg>`
}

function scenarioChart (scenario, { labels, points, units, medians, colour, stat, t0, t1 }) {
  const W = 360
  const H = 230
  const m = { l: 50, r: 12, t: 26, b: 34 }
  const pw = W - m.l - m.r
  const ph = H - m.t - m.b
  const all = labels.flatMap((l) => points[scenario]?.[l] ?? [])
  if (!all.length) return ''
  const unit = units[scenario]
  const yMaxRaw = Math.max(...all.map((p) => p.value)) * 1.3
  const [divisor, suffix] = unitScale(unit, yMaxRaw)
  const yMax = niceMax(yMaxRaw / divisor) * divisor
  const span = Math.max(t1 - t0, 1)
  // nudge labels apart so runs at similar times don't overlap
  const x = (date, i) => m.l + 12 + ((date - t0) / span) * (pw - 24) + (i - (labels.length - 1) / 2) * 7
  const y = (v) => m.t + ph - (Math.min(v, yMax) / yMax) * ph

  let svg = `<text x="${W / 2}" y="16" text-anchor="middle" font-weight="bold">${esc(scenario)}</text>`
  for (let i = 0; i <= 4; i++) {
    const v = (yMax * i) / 4
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/>`
    svg += `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" fill="#666">${fmt(v / divisor)}</text>`
  }
  svg += `<text x="14" y="${m.t + ph / 2}" transform="rotate(-90 14 ${m.t + ph / 2})" text-anchor="middle" fill="#666">${esc(suffix)}</text>`
  svg += `<text x="${m.l}" y="${H - 10}" fill="#666">${fmtDate(new Date(t0))}</text>`
  if (t1 > t0) svg += `<text x="${W - m.r}" y="${H - 10}" text-anchor="end" fill="#666">${fmtDate(new Date(t1))}</text>`

  labels.forEach((l, i) => {
    const c = colour(l)
    const med = medians[scenario][l]
    if (med !== undefined) {
      svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(med)}" y2="${y(med)}" stroke="${c}" stroke-dasharray="5 4" opacity="0.7"/>`
    }
    for (const p of points[scenario]?.[l] ?? []) {
      const px = x(p.date, i)
      const tip = `${l}\n${p.date.toLocaleString()}\n${stat} ${fmtV(p.value, unit)} (min ${fmtV(p.min, unit)}, max ${fmtV(p.max, unit)})`
      svg += `<line x1="${px}" x2="${px}" y1="${y(p.min)}" y2="${y(p.max)}" stroke="${c}" opacity="0.35"/>`
      svg += `<circle cx="${px}" cy="${y(p.value)}" r="3.5" fill="${c}"><title>${esc(tip)}</title></circle>`
    }
  })
  return `<svg width="${W}" height="${H}" font-size="11">${svg}</svg>`
}

async function load (files) {
  try {
    const texts = await Promise.all([...files].map((f) => f.text()))
    runs = texts.flatMap(parse)
    render()
  } catch (err) {
    out.textContent = `Could not read results: ${err.message}`
  }
}

const controls = document.getElementById('controls')
document.getElementById('files').addEventListener('change', (e) => load(e.target.files))
statSelect.addEventListener('change', render)
document.addEventListener('dragover', (e) => { e.preventDefault(); controls.classList.add('over') })
document.addEventListener('dragleave', () => controls.classList.remove('over'))
document.addEventListener('drop', (e) => {
  e.preventDefault()
  controls.classList.remove('over')
  load(e.dataTransfer.files)
})

const embedded = document.getElementById('data').textContent.trim()
if (embedded) {
  runs = parse(embedded)
  render()
}
</script>
</body>
</html>
